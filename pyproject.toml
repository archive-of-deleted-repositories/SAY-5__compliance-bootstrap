[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-bootstrap"
version = "0.1.0"
description = "Bash + Python compliance bootstrap: 30+ CIS-flavored Linux checks with per-deviation Bash remediation snippets"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Sai Asish Y" }]
keywords = ["linux", "compliance", "cis", "security", "bootstrap", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "types-pyyaml",
]

[project.scripts]
compliance-bootstrap = "compliance_bootstrap.cli:main"

[project.urls]
Repository = "https://github.com/SAY-5/compliance-bootstrap"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compliance_bootstrap = [
    "py.typed",
    "remediation/snippets/*.sh",
    "policies/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# UP042: keep Status as `str+Enum` for backward-compatible JSON .value access
# SIM105: a try/except/pass is clearer than contextlib.suppress in I/O hot paths
# SIM108: explicit if/else is more readable than ternary in registration code
ignore = ["E501", "UP042", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "N802", "N803"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/compliance_bootstrap"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
