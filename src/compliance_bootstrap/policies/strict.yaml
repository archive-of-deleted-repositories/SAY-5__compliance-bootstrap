# strict.yaml — overlay onto cis-ubuntu-22 for "no exceptions" hosts.
#
# Today this is identical to the baseline plus a couple of comment
# changes; the schema reserves `disabled` for future tightening (e.g.
# removing IPv6 RA from the unavailable-skips path on hosts that *do*
# run dual-stack and must enforce the value rather than skip).
name: strict
description: cis-ubuntu-22 with no allowable skips
enabled:
  - fs.tmp_separate
  - fs.tmp_nodev
  - fs.tmp_nosuid
  - fs.var_log_separate
  - fs.usb_storage_disabled
  - ssh.protocol_2
  - ssh.permit_root_login
  - ssh.password_authentication
  - ssh.max_auth_tries
  - ssh.client_alive_interval
  - ssh.x11_forwarding
  - ssh.max_sessions
  - ssh.banner
  - pam.password_minlen
  - pam.password_classes
  - pam.password_reuse
  - pam.account_lockout
  - auditd.installed
  - auditd.enabled
  - auditd.log_dir_mode
  - auditd.sudoers_rules
  - net.icmp_redirects
  - net.source_route
  - net.log_martians
  - net.ipv6_ra_disabled
  - net.firewall_active
  - pkg.required_present
  - pkg.unwanted_absent
  - pkg.unattended_upgrades
  - pkg.signature_verification
  - kernel.aslr
  - kernel.kptr_restrict
  - kernel.protected_links
disabled: []
overrides:
  treat_unavailable_as_fail: true
